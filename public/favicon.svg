<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent favicon: no tile (owner call, 2026-08-29). The GLYPH adapts
       instead — near-black on light browser chrome, cream on dark — and the
       teal è-dot stays constant. The Apple touch icon (tikem-mark.svg) keeps
       its opaque tile; home screens need one. -->
  <style>
    .glyph { fill: #0A0A0A; stroke: #0A0A0A; }
    @media (prefers-color-scheme: dark) {
      .glyph { fill: #F6F3EA; stroke: #F6F3EA; }
    }
  </style>
  <text class="glyph" x="49" y="83" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="96" font-weight="700" stroke-width="2.6" paint-order="stroke" text-anchor="middle">t</text>
  <circle cx="74" cy="25" r="7" fill="#2DD4BF"/>
</svg>
